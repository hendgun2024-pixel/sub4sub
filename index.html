<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Penerima Tamu - Sub4Sub World</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Arial', sans-serif;
        }
        body {
            background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .chat-container {
            width: 100%;
            max-width: 500px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.2);
            overflow: hidden;
        }
        .chat-header {
            background: #6a11cb;
            color: white;
            padding: 15px;
            text-align: center;
            font-weight: bold;
            font-size: 18px;
        }
        .chat-box {
            height: 400px;
            overflow-y: auto;
            padding: 20px;
            background: #f8f9fa;
        }
        .message {
            margin-bottom: 15px;
            padding: 10px 15px;
            border-radius: 12px;
            max-width: 80%;
            line-height: 1.4;
        }
        .bot {
            background: #e9ecef;
            color: #333;
            margin-right: auto;
        }
        .user {
            background: #2575fc;
            color: white;
            margin-left: auto;
        }
        .input-area {
            display: flex;
            padding: 15px;
            gap: 10px;
            background: white;
            border-top: 1px solid #ddd;
        }
        #userInput {
            flex: 1;
            padding: 12px 15px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
        }
        #sendBtn {
            padding: 12px 20px;
            background: #6a11cb;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }
        #sendBtn:hover {
            background: #5a0fb8;
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">🤖 Penerima Tamu Sub4Sub World</div>
        <div class="chat-box" id="chatBox"></div>
        <div class="input-area">
            <input type="text" id="userInput" placeholder="Tulis nama atau sapa disini...">
            <button id="sendBtn">Kirim</button>
        </div>
    </div>

    <script>
        const chatBox = document.getElementById('chatBox');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');

        // Fungsi ambil hari, jam, tahun otomatis
        function getWaktuLengkap() {
            const hariNama = ["Minggu", "Senin", "Selasa", "Rabu", "Kamis", "Jumat", "Sabtu"];
            const sekarang = new Date();
            const hari = hariNama[sekarang.getDay()];
            const jam = sekarang.getHours().toString().padStart(2, '0');
            const menit = sekarang.getMinutes().toString().padStart(2, '0');
            const tahun = sekarang.getFullYear();
            return { hari, jam, menit, tahun };
        }

        // Tambah pesan ke layar
        function tambahPesan(teks, tipe) {
            const div = document.createElement('div');
            div.className = `message ${tipe}`;
            div.textContent = teks;
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        // Jawaban bot khusus penerima tamu
        function jawabBot(pesanUser) {
            const { hari, jam, menit, tahun } = getWaktuLengkap();
            const nama = pesanUser.trim();

            // Kalau cuma sapa, minta nama
            if (/halo|hai|assalamualaikum|selamat pagi|selamat siang|selamat sore|selamat malam/i.test(nama)) {
                return `👋 Halo! Selamat datang di Sub4Sub World 😊 Boleh saya tahu siapa nama Anda?`;
            }

            // Kalau sudah sebut nama → kasih sambutan lengkap
            if (nama.length > 1 && !/iya|tidak|makasih|terima kasih/i.test(nama)) {
                return `✅ Selamat datang **${nama}**! Terima kasih sudah bergabung bersama kami 🎉
🗓️ Hari : ${hari}
⏰ Jam : ${jam}:${menit} WIB
📆 Tahun : ${tahun}

Semoga betah dan sukses selalu ya di sini! 🙌`;
            }

            // Kalau tulisan gak jelas
            return `🙏 Maaf, saya cuma penerima tamu. Silakan sebutkan nama Anda saja ya, nanti saya sapa lengkap sama waktunya 😊`;
        }

        // Kirim pesan saat klik tombol / tekan enter
        function prosesChat() {
            const teks = userInput.value.trim();
            if (!teks) return;

            tambahPesan(teks, 'user');
            userInput.value = '';

            setTimeout(() => {
                const balasan = jawabBot(teks);
                tambahPesan(balasan, 'bot');
            }, 800);
        }

        sendBtn.addEventListener('click', prosesChat);
        userInput.addEventListener('keypress', (e) => e.key === 'Enter' && prosesChat());

        // Pesan pembuka pas buka web
        window.onload = () => {
            tambahPesan(`🤖 Selamat datang di Sub4Sub World!
Silakan sapa atau tulis nama Anda di bawah ya 😊`, 'bot');
        };
    </script>
</body>
</html>
